<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>视频倒放工具</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
.wrap{max-width:760px;margin:auto;padding:28px 16px 44px}
h1{text-align:center;margin:0 0 8px;font-size:28px}.sub{text-align:center;color:#68758a;margin-bottom:22px}
.card{background:#fff;border:1px solid #e4e9f0;border-radius:18px;padding:20px;box-shadow:0 8px 28px #0000000a}
.drop{border:2px dashed #cbd4df;border-radius:14px;padding:40px 14px;text-align:center;cursor:pointer}
.icon{font-size:42px}.drop b{font-size:17px}.hint{margin-top:8px;color:#7a8798;font-size:13px}
input{display:none}.info{display:none;margin-top:18px}.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:#7a8798;font-size:13px;margin-top:5px}
video{display:none;width:100%;max-height:430px;background:#10151c;border-radius:12px;margin-top:14px}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:12px 18px;font-size:15px}
.primary{background:#246bfe;color:#fff}.ghost{background:#edf1f6;color:#273348}
button:disabled{opacity:.55}
.progress{display:none;margin-top:18px}.bar{height:9px;border-radius:9px;background:#e8edf3;overflow:hidden}
.fill{height:100%;width:0;background:#246bfe}.status{font-size:13px;color:#657287;margin-top:8px;word-break:break-word}
.download{display:none;margin-top:18px;text-align:center}.download a{display:inline-block;text-decoration:none}
.note{text-align:center;color:#8994a3;font-size:12px;line-height:1.6;margin-top:16px}
.warn{display:none;background:#fff7df;border:1px solid #f0d58a;color:#705a1b;padding:10px 12px;border-radius:10px;font-size:13px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
<h1>视频倒放工具</h1>
<div class="sub">完全在浏览器本地处理，不上传视频</div>
<div class="card">
  <div class="drop" id="drop">
    <div class="icon">🎬</div>
    <div><b>点击选择视频</b> 或把视频拖到这里</div>
    <div class="hint">支持手机常见 MP4、MOV、WebM 等格式</div>
    <input id="file" type="file" accept="video/*">
  </div>

  <div class="info" id="info">
    <div class="name" id="name"></div>
    <div class="meta" id="meta"></div>
    <video id="preview" controls playsinline></video>
    <div class="warn" id="warn">使用 FFmpeg 在浏览器本地编码，输出标准 MP4；视频不会上传到服务器。</div>
    <div class="row">
      <button class="primary" id="reverse">开始倒放</button>
      <button class="ghost" id="clear">重新选择</button>
    </div>
  </div>

  <div class="progress" id="progress">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="status" id="status">准备中…</div>
  </div>
  <div class="download" id="download"></div>
</div>
<div class="note">使用 FFmpeg 在浏览器本地处理并编码 MP4。<br>首次处理会加载编码器，长视频会需要更长时间。</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let current=null, objectUrl=null;

function pick(file){
  if(!file) return;
  if(!file.type.startsWith("video/")){alert("请选择视频文件");return}
  current=file;
  $("name").textContent=file.name;
  $("meta").textContent=(file.size/1024/1024).toFixed(1)+" MB · "+(file.type||"video");
  $("info").style.display="block";
  $("warn").style.display="block";
  $("progress").style.display="none";
  $("download").style.display="none";
  $("download").innerHTML="";
  if(objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl=URL.createObjectURL(file);
  $("preview").src=objectUrl;
  $("preview").style.display="block";
}
$("drop").onclick=()=>$("file").click();
$("file").onchange=e=>pick(e.target.files[0]);
$("drop").ondragover=e=>{e.preventDefault()};
$("drop").ondrop=e=>{e.preventDefault();pick(e.dataTransfer.files[0])};
$("clear").onclick=()=>location.reload();

function waitEvent(el,name,timeout=10000){
  return new Promise((resolve,reject)=>{
    let done=false;
    const timer=setTimeout(()=>finish(new Error("视频读取超时")),timeout);
    function finish(err){
      if(done)return;done=true;clearTimeout(timer);el.removeEventListener(name,ok);
      err?reject(err):resolve();
    }
    function ok(){finish()}
    el.addEventListener(name,ok,{once:true});
  });
}

async function seek(video,time){
  if(Math.abs(video.currentTime-time)<0.0005)return;
  video.currentTime=Math.max(0,Math.min(video.duration,time));
  await waitEvent(video,"seeked",15000);
}

function getMime(){
  const list=[
    "video/webm;codecs=vp8,opus",
    "video/webm;codecs=vp9,opus",
    "video/webm"
  ];
  return list.find(x=>MediaRecorder.isTypeSupported(x))||"";
}

async function reverseVideo(){
  if(!current)return;
  $("reverse").disabled=true;
  $("progress").style.display="block";
  $("download").style.display="none";
  $("fill").style.width="2%";
  $("status").textContent="正在加载 MP4 编码器…";

  try{
    if(!window.FFmpeg) throw new Error("MP4 编码器加载失败，请刷新页面后重试");
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg=createFFmpeg({log:false});
    if(!ffmpeg.isLoaded()) await ffmpeg.load();

    $("status").textContent="正在读取视频…";
    ffmpeg.FS("writeFile","input",await fetchFile(current));

    ffmpeg.setProgress(({ratio})=>{
      const pct=Math.max(2,Math.min(96,Math.round(ratio*96)));
      $("fill").style.width=pct+"%";
      $("status").textContent="正在倒放并编码 MP4… "+Math.round(ratio*100)+"%";
    });

    await ffmpeg.run(
      "-i","input",
      "-vf","reverse",
      "-af","areverse",
      "-c:v","libx264",
      "-preset","veryfast",
      "-crf","23",
      "-pix_fmt","yuv420p",
      "-c:a","aac",
      "-b:a","128k",
      "-movflags","+faststart",
      "output.mp4"
    );

    const data=ffmpeg.FS("readFile","output.mp4");
    const out=new Blob([data.buffer],{type:"video/mp4"});
    const url=URL.createObjectURL(out);

    const a=document.createElement("a");
    a.href=url;
    a.download="reversed_"+current.name.replace(/\.[^.]+$/,"")+".mp4";
    a.className="primary";
    a.style.display="inline-block";
    a.style.padding="12px 18px";
    a.style.borderRadius="10px";
    a.style.color="#fff";
    a.textContent="⬇ 下载 MP4 倒放视频";

    $("download").innerHTML="";
    $("download").appendChild(a);
    $("download").style.display="block";
    $("fill").style.width="100%";
    $("status").textContent="处理完成！输出格式：MP4";

    try{
      ffmpeg.FS("unlink","input");
      ffmpeg.FS("unlink","output.mp4");
    }catch(e){}
  }catch(e){
    console.error(e);
    $("fill").style.width="0";
    $("status").textContent="处理失败："+(e.message||String(e));
  }finally{
    $("reverse").disabled=false;
  }
}

$("reverse").onclick=async()=>{
  try{await reverseVideo()}
  catch(e){
    console.error(e);
    $("fill").style.width="0";
    $("status").textContent="处理失败："+(e.message||String(e));
  }finally{$("reverse").disabled=false}
};
</script>
</body>
</html>
