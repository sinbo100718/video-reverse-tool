<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>视频倒放工具</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f7fb;color:#18202a}
.wrap{max-width:760px;margin:0 auto;padding:32px 16px 50px}
h1{font-size:28px;margin:0 0 8px;text-align:center}.sub{text-align:center;color:#697586;margin-bottom:24px}
.card{background:#fff;border:1px solid #e7ebf0;border-radius:18px;padding:22px;box-shadow:0 8px 30px #15233a0a}
.drop{border:2px dashed #cfd7e3;border-radius:14px;padding:42px 16px;text-align:center;cursor:pointer}
.drop:active,.drop.drag{border-color:#3478f6;background:#f5f9ff}
.icon{font-size:40px;margin-bottom:8px}.hint{color:#758195;font-size:13px;margin-top:8px}
input[type=file]{display:none}
.info{margin-top:18px;display:none}.file{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:13px;color:#778397;margin-top:5px}
video{width:100%;max-height:380px;background:#10151c;border-radius:12px;margin-top:16px;display:none}
.row{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 18px;font-size:15px;cursor:pointer}
.primary{background:#246bfe;color:#fff}.primary:disabled{background:#aebbd0;cursor:not-allowed}
.ghost{background:#eef2f7;color:#293548}
.progress{display:none;margin-top:18px}.bar{height:9px;background:#e9edf3;border-radius:9px;overflow:hidden}
.fill{height:100%;width:0;background:#246bfe;transition:width .15s}.status{font-size:13px;color:#657287;margin-top:8px;word-break:break-word}
.download{display:none;margin-top:18px;text-align:center}.download a{display:inline-block;text-decoration:none}
.note{text-align:center;color:#8792a2;font-size:12px;margin-top:18px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
<h1>视频倒放工具</h1>
<div class="sub">在浏览器本地处理视频，不主动上传视频</div>
<div class="card">
<div class="drop" id="drop">
<div class="icon">🎬</div>
<div><b>点击选择视频</b> 或把视频拖到这里</div>
<div class="hint">支持 MP4、MOV、WebM 等常见格式</div>
<input id="file" type="file" accept="video/*">
</div>

<div class="info" id="info">
<div class="file" id="name"></div>
<div class="meta" id="meta"></div>
<video id="preview" controls playsinline></video>
<div class="row">
<button class="btn primary" id="reverse">开始倒放</button>
<button class="btn ghost" id="clear">重新选择</button>
</div>
</div>

<div class="progress" id="progress">
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="status" id="status">准备中…</div>
</div>
<div class="download" id="download"></div>
</div>
<div class="note">提示：首次使用需要下载 FFmpeg 处理引擎，手机可能需要几十秒。<br>视频越长、分辨率越高，处理时间越久。</div>
</div>

<script type="module">
import { FFmpeg } from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";
import { fetchFile, toBlobURL } from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js";

const $=id=>document.getElementById(id);
const ffmpeg=new FFmpeg();
let loaded=false,current=null,progressBound=false;

async function loadFFmpeg(){
  if(loaded)return;
  $("status").textContent="正在加载视频处理引擎，首次使用请稍等…";

  const base="https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd";

  // FFmpeg.wasm 0.12 creates a Web Worker. On GitHub Pages, loading that
  // worker directly from jsDelivr is blocked by browser cross-origin rules.
  // We create the worker as a same-page Blob instead, while still downloading
  // the FFmpeg core/WASM from the CDN.
  const workerCode = `
    const FFMessageType={LOAD:"LOAD",EXEC:"EXEC",WRITE_FILE:"WRITE_FILE",READ_FILE:"READ_FILE",DELETE_FILE:"DELETE_FILE",RENAME:"RENAME",CREATE_DIR:"CREATE_DIR",LIST_DIR:"LIST_DIR",DELETE_DIR:"DELETE_DIR",MOUNT:"MOUNT",UNMOUNT:"UNMOUNT",ERROR:"ERROR",DOWNLOAD:"DOWNLOAD",PROGRESS:"PROGRESS",LOG:"LOG"};
    const ERROR_UNKNOWN_MESSAGE_TYPE=new Error("unknown message type");
    const ERROR_NOT_LOADED=new Error("ffmpeg is not loaded, call \`await ffmpeg.load()\` first");
    const ERROR_IMPORT_FAILURE=new Error("failed to import ffmpeg-core.js");
    let ffmpeg;
    const load=async({coreURL:_coreURL,wasmURL:_wasmURL,workerURL:_workerURL})=>{
      const first=!ffmpeg;
      if(!_coreURL) throw ERROR_IMPORT_FAILURE;
      let mod;
      try { mod=await import(_coreURL); } catch(e) { throw ERROR_IMPORT_FAILURE; }
      const createFFmpegCore=mod.default||self.createFFmpegCore;
      if(!createFFmpegCore) throw ERROR_IMPORT_FAILURE;
      const coreURL=_coreURL;
      const wasmURL=_wasmURL||_coreURL.replace(/\.js$/,".wasm");
      const workerURL=_workerURL||_coreURL.replace(/\.js$/,".worker.js");
      ffmpeg=await createFFmpegCore({mainScriptUrlOrBlob:coreURL+"#"+btoa(JSON.stringify({wasmURL,workerURL}))});
      ffmpeg.setLogger(data=>self.postMessage({type:FFMessageType.LOG,data}));
      ffmpeg.setProgress((progress,time)=>self.postMessage({type:FFMessageType.PROGRESS,data:{progress,time}}));
      return first;
    };
    const exec=({args,timeout=-1})=>{ffmpeg.setTimeout(timeout);ffmpeg.exec(...args);const ret=ffmpeg.ret;ffmpeg.reset();return ret};
    const ffprobe=({args,timeout=-1})=>{ffmpeg.setTimeout(timeout);ffmpeg.ffprobe(...args);const ret=ffmpeg.ret;ffmpeg.reset();return ret};
    const writeFile=({path,data})=>{ffmpeg.FS.writeFile(path,data);return true};
    const readFile=({path,encoding})=>ffmpeg.FS.readFile(path,{encoding});
    const deleteFile=({path})=>{ffmpeg.FS.unlink(path);return true};
    const rename=({oldPath,newPath})=>{ffmpeg.FS.rename(oldPath,newPath);return true};
    const createDir=({path})=>{ffmpeg.FS.mkdir(path);return true};
    const listDir=({path})=>{const names=ffmpeg.FS.readdir(path);return names.map(name=>{const stat=ffmpeg.FS.stat(path+"/"+name);return{name,isDir:ffmpeg.FS.isDir(stat.mode)}})};
    const deleteDir=({path})=>{ffmpeg.FS.rmdir(path);return true};
    const mount=({fsType,options,mountPoint})=>{const fs=ffmpeg.FS.filesystems[fsType];if(!fs)return false;ffmpeg.FS.mount(fs,options,mountPoint);return true};
    const unmount=({mountPoint})=>{ffmpeg.FS.unmount(mountPoint);return true};
    self.onmessage=async({data:{id,type,data:_data}})=>{
      const trans=[];let data;
      try{
        if(type!==FFMessageType.LOAD&&!ffmpeg)throw ERROR_NOT_LOADED;
        switch(type){
          case FFMessageType.LOAD:data=await load(_data);break;
          case FFMessageType.EXEC:data=exec(_data);break;
          case FFMessageType.FFPROBE:data=ffprobe(_data);break;
          case FFMessageType.WRITE_FILE:data=writeFile(_data);break;
          case FFMessageType.READ_FILE:data=readFile(_data);break;
          case FFMessageType.DELETE_FILE:data=deleteFile(_data);break;
          case FFMessageType.RENAME:data=rename(_data);break;
          case FFMessageType.CREATE_DIR:data=createDir(_data);break;
          case FFMessageType.LIST_DIR:data=listDir(_data);break;
          case FFMessageType.DELETE_DIR:data=deleteDir(_data);break;
          case FFMessageType.MOUNT:data=mount(_data);break;
          case FFMessageType.UNMOUNT:data=unmount(_data);break;
          default:throw ERROR_UNKNOWN_MESSAGE_TYPE;
        }
      }catch(e){self.postMessage({id,type:FFMessageType.ERROR,data:String(e)});return}
      if(data instanceof Uint8Array)trans.push(data.buffer);
      self.postMessage({id,type,data},trans);
    };
  `;
  const classWorkerURL=URL.createObjectURL(new Blob([workerCode],{type:"text/javascript"}));
  const coreURL=await toBlobURL(base+"/ffmpeg-core.js","text/javascript");
  const wasmURL=await toBlobURL(base+"/ffmpeg-core.wasm","application/wasm");

  await ffmpeg.load({coreURL,wasmURL,classWorkerURL});

  loaded=true;

  if(!progressBound){
    ffmpeg.on("progress",({progress})=>{
      const p=Math.max(5,Math.min(99,Math.round(progress*100)));
      $("fill").style.width=p+"%";
      $("status").textContent="正在处理… "+p+"%";
    });
    progressBound=true;
  }
}

function pick(file){
  if(!file)return;
  if(!file.type.startsWith("video/")){
    alert("请选择视频文件。");
    return;
  }

  current=file;
  $("name").textContent=file.name;
  $("meta").textContent=(file.size/1024/1024).toFixed(1)+" MB · "+(file.type||"video");
  $("info").style.display="block";
  $("download").style.display="none";
  $("progress").style.display="none";

  const url=URL.createObjectURL(file);
  $("preview").src=url;
  $("preview").style.display="block";
}

$("drop").onclick=()=>$("file").click();
$("file").onchange=e=>pick(e.target.files[0]);
$("drop").ondragover=e=>{e.preventDefault();$("drop").classList.add("drag")};
$("drop").ondragleave=()=>$("drop").classList.remove("drag");
$("drop").ondrop=e=>{
  e.preventDefault();
  $("drop").classList.remove("drag");
  pick(e.dataTransfer.files[0]);
};
$("clear").onclick=()=>location.reload();

$("reverse").onclick=async()=>{
  if(!current)return;

  $("reverse").disabled=true;
  $("progress").style.display="block";
  $("download").style.display="none";
  $("download").innerHTML="";
  $("fill").style.width="3%";
  $("status").textContent="准备处理…";

  try{
    await loadFFmpeg();

    $("status").textContent="正在读取视频…";

    const input="input.mp4";
    const output="reversed.mp4";

    await ffmpeg.writeFile(input,await fetchFile(current));

    $("status").textContent="正在倒放视频…";

    await ffmpeg.exec([
      "-i",input,
      "-vf","reverse",
      "-af","areverse",
      "-c:v","mpeg4",
      "-q:v","5",
      "-c:a","aac",
      "-b:a","128k",
      output
    ]);

    $("status").textContent="正在生成下载文件…";
    $("fill").style.width="100%";

    const data=await ffmpeg.readFile(output);
    const blob=new Blob([data.buffer],{type:"video/mp4"});
    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");
    a.href=url;
    a.download="reversed_"+current.name.replace(/\.[^.]+$/,"")+".mp4";
    a.className="btn primary";
    a.textContent="⬇ 下载倒放视频";

    $("download").appendChild(a);
    $("download").style.display="block";
    $("status").textContent="处理完成！";
  }catch(e){
    console.error(e);
    $("fill").style.width="0";
    const msg=e && e.message ? e.message : String(e);
    $("status").textContent="处理失败："+msg.slice(0,220);
  }finally{
    $("reverse").disabled=false;
  }
};
</script>
</body>
</html>
